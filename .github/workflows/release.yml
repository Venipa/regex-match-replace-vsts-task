on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Platforms to build on/for
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [24.14.0]


    steps:
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Check out Git repository
        uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      
      - if: github.ref_type == 'tag'
        id: getVersion
        uses: actions/github-script@v7.0.1
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          script: |
            const isVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/
            const id = process.env.REF_NAME && process.env.REF_NAME.split('v')[1] || process.env.REF_NAME
            const [major, minor, patch] = id.split('.').map(Number);
            core.setOutput("value", id);
            core.setOutput("major", major);
            core.setOutput("minor", minor);
            core.setOutput("patch", patch);
            core.setOutput("ok", isVersion.test(id));
      
      - if: github.ref_type == 'tag' && steps.getVersion.outputs.ok
        name: set app version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: package.json
          field: version
          value: ${{ steps.getVersion.outputs.value }}
      - if: github.ref_type == 'tag' && steps.getVersion.outputs.ok
        name: set task version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: BuildTask/RegexMatchReplace/task.json
          field: "version"
          value: '{"Major": ${{ steps.getVersion.outputs.major }}, "Minor": ${{ steps.getVersion.outputs.minor }}, "Patch": ${{ steps.getVersion.outputs.patch }}}'
          parse_json: true
      
      - if: github.ref_type == 'tag' && steps.getVersion.outputs.ok
        name: set vss-extension version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: vss-extension.json
          field: version
          value: ${{ steps.getVersion.outputs.value }}
      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
      - name: Build for publishing
        run: |
          mkdir -p dist/BuildTask/RegexMatchReplace
          cp package.json dist/BuildTask/RegexMatchReplace
          cp BuildTask/RegexMatchReplace/icon.png dist/BuildTask/RegexMatchReplace
          cp BuildTask/RegexMatchReplace/task.json dist/BuildTask/RegexMatchReplace
          pnpm install --dir "dist/BuildTask/RegexMatchReplace" --prod --no-frozen-lockfile --shamefully-hoist --ignore-workspace
          pnpm compile
      - name: Run tests
        run: |
          pnpm test:ci
      - name: Publish test annotations
        if: always() && hashFiles('test-results/vitest-junit.xml') != ''
        uses: dorny/test-reporter@v2
        with:
          name: Vitest Results
          path: test-results/vitest-junit.xml
          reporter: java-junit
      - name: Package extension
        run: |
          pnpm package
      - name: Upload vsix
        uses: actions/upload-artifact@v4.1.0
        with:
          name: venipa.multi-regex-match-replace-${{ steps.getVersion.outputs.value }}
          path: venipa.multi-regex-match-replace-*.vsix