on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Platforms to build on/for
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [24.14.0]


    steps:
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Check out Git repository
        uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      
      - if: github.ref_type == 'tag'
        id: getVersion
        uses: actions/github-script@v7.0.1
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          script: |
            const isVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/
            const id = process.env.REF_NAME && process.env.REF_NAME.split('v')[1] || process.env.REF_NAME
            core.setOutput("value", id);
      
      - if: github.ref_type == 'tag' && steps.getVersion.outputs.ok
        name: set app version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: package.json
          field: version
          value: ${{ steps.getVersion.outputs.value }}
      
      - if: github.ref_type == 'tag' && steps.getVersion.outputs.ok
        name: set vss-extension version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: vss-extension.json
          field: version
          value: ${{ steps.getVersion.outputs.value }}
      - name: Build and package
        run: |
          pnpm install --frozen-lockfile
          pnpm build-clean
          pnpm package
      - name: Upload vsix
        uses: actions/upload-artifact@v4.1.0
        with:
          path: venipa.multi-regex-match-replace-*.vsix